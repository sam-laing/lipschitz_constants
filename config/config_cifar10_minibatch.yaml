dataset: "cifar10"
seed: 42
num_workers: 4

# Training with mini-batches
iters: 100  # Number of epochs over the dataset
batch_size: 128  # Mini-batch size for training

model: "mlp_ortho"
loss: "cross_entropy"
hidden_dim: 1.5 
seperate_biases: true
use_bias: true
activation: "relu"
weight_init: ["normal", "full_orthogonal"]

# Optimizer configuration
optimizer: ["muon"]
momentum: 0.0
nesterov: false
orthogonalize: true
ns_steps: 5
lr: [1.e-4, 3.e-4, 1.e-3, 3.e-3]
beta1: 0.0
beta2: 0.0
eps: 1.e-8
weight_decay: [0.0]
adjust_lr: false
dual_decay: [false, true]
scheduler: null

# Hessian and Lipschitz tracking
track_hessian: false
hessian_freq: 1 
hessian_k: 5

track_lipschitz: false

# W&B logging
wandb_project_name: "cifar10_minibatch"
