# CIFAR-10 SGD (with momentum) Optimizer Sweep (Reduced)
# Testing: weight_init, lr, momentum, batch_size
# Total combinations: 2 inits × 4 LRs × 2 momentums × 2 batch_sizes = 32 jobs

dataset: "cifar10"
seed: 42
num_workers: 4

# Training settings
iters: 100  # epochs
batch_size: [128, 256]  # Standard sizes for CIFAR-10

# Model architecture
model: "mlp_ortho"
loss: "cross_entropy"
hidden_dim: 1.5 
seperate_biases: true
use_bias: true
activation: "relu"
weight_init: ["normal", "full_orthogonal"]  # Compare both initializations

# SGD optimizer configuration
optimizer: "sgd"
momentum: [0.0, 0.9]  # Vanilla SGD vs SGD with momentum
nesterov: false
orthogonalize: false
ns_steps: 0
lr: [1.e-3, 3.e-3, 1.e-2, 3.e-2]  # Focus on typical SGD learning rates
beta1: 0.0
beta2: 0.0
eps: 1.e-8
weight_decay: 0.0
adjust_lr: false
dual_decay: true
scheduler: null

# Tracking (keep off for speed)
track_hessian: false
hessian_freq: 1 
hessian_k: 5
track_lipschitz: false

# W&B logging
wandb_project_name: "cifar10_mlp_sweep"
