dataset: "cifar10_5k"
seed: 85
num_workers: 1

iters: 1000

model: "mlp_ortho"
loss: "cross_entropy"
hidden_dim: 1.5 
seperate_biases: true
use_bias: true
activation: "relu"
weight_init: "normal"
batch_size: "full"

optimizer: "muon"
momentum: 0.0
nesterov: false
orthogonalize: true
ns_steps: 5
lr: 0.005
beta1: 0.0
beta2: 0.0
eps: 1.e-8
weight_decay: 0.0
adjust_lr: false
dual_decay: false
scheduler: null

track_hessian: false
hessian_freq: 1 
hessian_k: 5

track_lipschitz: false
wandb_project_name: null
