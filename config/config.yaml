dataset: "cifar10_5k"
seed: 101
num_workers: 4

iters: 100

model: "mlp"
#hidden dim as proportion of input dim
hidden_dim: 2.5
separate_biases: true #playing with consuming bias into weights with [W|b][x|1]... maybe eliminates need for 2 optimizers
batch_size: "full" 
#optimizer cfg
optimizer: "sign_sgd"
momentum: 0.0
nesterov: false
orthogonalize: false
ns_steps: 5
lr: [0.00001, 0.00003, 0.0001, 0.0003, 0.001]
beta1: 0.0 
beta2: 0.0
eps: 1.e-8
weight_decay: 0.0
adjust_lr: true
scheduler: null

track_lipschitz: false

wandb_project_name: "lipschitz_track_test"