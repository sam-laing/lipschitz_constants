dataset: "cifar10_5k"
seed: 8    #5
num_workers: 1

iters: 100

model: "mlp_ortho"
loss: ["cross_entropy", "mse"]  # options: "cross_entropy", "mse"
#hidden dim as proportion of input dim
hidden_dim: 2.5
# playing with consuming bias into weights with [W|b][x|1]... maybe eliminates need for 2 optimizers
seperate_biases: true
use_bias: false
activation: "relu"
weight_init: ["normal", "full_orthogonal"]
batch_size: "full"
#optimizer cfg
optimizer: ["sgd"]   #, "sgd", "sign_sgd"]
momentum: 0.0
nesterov: false
orthogonalize: true
ns_steps: 5
lr: [3.e-7, 1.e-6, 3.e-6, 1.e-5, 3.e-5, 1.e-4, 3.e-3]
beta1: 0.0
beta2: 0.0
eps: 1.e-8
weight_decay: [0.0]
adjust_lr: false
dual_decay: [false, true]
scheduler: null

track_hessian: false
hessian_freq: 1 
hessian_k: 5


track_lipschitz: false
wandb_project_name: "orhog_initialization"